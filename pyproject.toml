[project]
name = "syncview"
version = "0.1.0"
description = "Synchronized behaviour video + Open Ephys EMG/GI data: clip rendering and an interactive viewer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Matthew Perkins"}]
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib", "pillow", "PySide6", "pyqtgraph", "av"]

[project.optional-dependencies]
# GPU video decoding (NVIDIA GPU + driver required); without it the CPU decoder (PyAV) is used
gpu = ["PyNvVideoCodec"]

[project.scripts]
syncview = "syncview.app.main:main"

[build-system]
requires = ["setuptools>=77"]      # SPDX license field (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["syncview*"]
